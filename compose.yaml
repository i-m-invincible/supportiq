services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supportiq
      POSTGRES_USER: supportiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportiq_local_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportiq -d supportiq"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://supportiq:${POSTGRES_PASSWORD:-supportiq_local_demo}@db:5432/supportiq
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO: ${SEED_DEMO:-true}
      API_KEY: ${API_KEY:-}
      DRAFT_PROVIDER: ${DRAFT_PROVIDER:-extractive}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
