name: Verify SupportIQ
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: supportiq_test
          POSTGRES_USER: supportiq
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U supportiq -d supportiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m app.ml.training
        env:
          PYTHONPATH: backend
      - run: alembic -c backend/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://supportiq:ci_only_password@localhost:5432/supportiq_test
      - run: pytest --cov=backend/app --cov-report=xml:artifacts/coverage.xml
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://supportiq:ci_only_password@localhost:5432/supportiq_test
      - uses: actions/upload-artifact@v4
        with:
          name: backend-evaluation
          path: artifacts/*.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 240
      - run: curl --fail http://localhost:8080/health && curl --fail http://localhost:8080/api/v1/analytics
      - run: docker compose down
        if: always()
